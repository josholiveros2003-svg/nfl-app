# Free scheduled job (GitHub Actions) that keeps the app's stats fresh.
#
# Every few hours it downloads the latest nflverse data and rebuilds the stats. Every 30
# minutes it also takes a quick look at ESPN's live rosters and rebuilds if anyone moved.
# If anything changed (i.e. games were played), it saves the new data to the
# repo and republishes the website on GitHub Pages. If nothing changed, it stops
# early, so quiet days cost almost nothing.
name: Update data & deploy

on:
  schedule:
    # Times are UTC. Every 6 hours all week, to catch roster, injury and late stat changes.
    - cron: "17 */6 * * *"
    # Every 30 minutes while games are being played, so results show up soon after the final
    # whistle. The windows are wide enough to cover both daylight time (UTC-4) and standard
    # time (UTC-5) in the US. Off-minutes (7, 37) because GitHub delays runs at :00 and :30.
    # Sunday afternoon and evening (1pm ET kickoffs to Sunday night)
    - cron: "7,37 16-23 * * 0"
    # Saturday games (late in the season)
    - cron: "7,37 16-23 * * 6"
    # Night games, which end after midnight UTC (Saturday, Sunday, Monday and Thursday nights)
    - cron: "7,37 0-5 * * 0,1,2,5"
    # All year: a quick check for trades, releases and signings (see the first steps below).
    # This takes seconds and only starts a full rebuild when a roster actually changed.
    - cron: "22,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on GitHub for manual runs

permissions:
  contents: write # to save updated data back to the repo
  pages: write # to publish the site
  id-token: write # required by GitHub Pages deploy

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for roster moves
        id: rosters
        if: github.event.schedule == '22,52 * * * *'
        run: python3 pipeline/espn_live.py --check

      - uses: actions/setup-python@v7
        if: steps.rosters.outputs.changed != 'false'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Build stats from nflverse
        if: steps.rosters.outputs.changed != 'false'
        run: |
          pip install -r pipeline/requirements.txt
          python pipeline/build_data.py

      - name: Save new data (if any)
        id: save
        if: steps.rosters.outputs.changed != 'false'
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "No new data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update NFL data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Everything below only runs when there's something new to publish.
      - uses: actions/setup-node@v7
        if: steps.save.outputs.changed == 'true' || steps.rosters.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          node-version: 24
          cache: npm

      - name: Build website
        if: steps.save.outputs.changed == 'true' || steps.rosters.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          npm ci
          # GitHub Pages serves the site at /<repo-name>/ (unless the repo is <user>.github.io).
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then export EXPO_PUBLIC_BASE_URL=""; else export EXPO_PUBLIC_BASE_URL="/$REPO"; fi
          npm run build:web

      - uses: actions/upload-pages-artifact@v5
        if: steps.save.outputs.changed == 'true' || steps.rosters.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: dist

      - id: deploy
        if: steps.save.outputs.changed == 'true' || steps.rosters.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v5
